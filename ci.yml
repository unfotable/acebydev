name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JS dev dependencies (esbuild + three)
        run: npm ci || npm install --no-audit --no-fund

      - name: JavaScript tests (node:test, with coverage)
        run: node --test --experimental-test-coverage tests/js/*.test.mjs

      - name: Python tests (unittest, with coverage on tools/)
        run: |
          python -m pip install --quiet coverage
          python -m coverage run --include="tools/*" -m unittest discover -s tests -p "test_*.py"
          python -m coverage report --include="tools/*" --fail-under=91

      - name: Performance & quality audit (budgets, loop-allocation lint)
        run: python tools/audit.py

      - name: Production build
        run: python tools/build.py

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
